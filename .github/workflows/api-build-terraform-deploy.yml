# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build, provision and deploy API app

on:
  workflow_dispatch:

#Special permissions required for OIDC authentication
permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROJECT_FOLDER: "RabbitMqProductAPI"
      PROJECT_NAME: "RabbitMqProductAPI"
      DOTNET_VERSION: "9.x"
      DOTNET_EF_VERSION: "9.0.1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{env.DOTNET_VERSION}}

      - name: Build with dotnet
        working-directory: ${{env.PROJECT_FOLDER}}
        run: dotnet build --configuration Release

      - name: dotnet publish
        working-directory: ${{env.PROJECT_FOLDER}}
        run: dotnet publish -c Release -o myapp

      - name: install dotnet ef
        working-directory: ${{env.PROJECT_FOLDER}}
        run: dotnet tool install -g dotnet-ef --version ${{env.DOTNET_EF_VERSION}}

      - name: dotnet bundle migration
        working-directory: ${{env.PROJECT_FOLDER}}
        run: dotnet ef migrations bundle --runtime linux-x64 -p ${{env.PROJECT_NAME}}.csproj -o myapp/migrate

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.PROJECT_FOLDER}}/myapp

  provision:
    runs-on: ubuntu-latest
    environment:
      name: "Azure"
    env:
      #These environment variables are used by the terraform azure provider to setup OIDD authenticate. 
      ARM_CLIENT_ID: "${{ secrets.AZURE_CLIENT_ID }}"
      ARM_SUBSCRIPTION_ID: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
      ARM_TENANT_ID: "${{ secrets.AZURE_TENANT_ID }}"
      #this is needed since we are running terraform with read-only permissions
      ARM_SKIP_PROVIDER_REGISTRATION: true
      #Terraform backend configuration
      TF_VAR_RESOURCE_GROUP: "${{ secrets.TF_VAR_RESOURCE_GROUP }}"
      TF_VAR_STORAGE_ACCOUNT: "${{ secrets.TF_VAR_STORAGE_ACCOUNT }}"
      TF_VAR_CONTAINER: "${{ secrets.TF_VAR_CONTAINER }}"
      TF_VAR_STATE_KEY: "${{ secrets.TF_VAR_STATE_KEY }}"
    outputs:
      tfplanExitCode: ${{ steps.tf-plan.outputs.exitcode }}

    steps:
    - uses: actions/checkout@v4    

      # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
    
    - name: Azure login
      uses: azure/login@v2
      with:
        auth-type: IDENTITY
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        enable-AzPSSession: true

    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: Terraform Init
      working-directory: terraform
      run: |
        terraform init -backend-config="resource_group_name=${{env.TF_VAR_RESOURCE_GROUP}}" \
        -backend-config="storage_account_name=${{env.TF_VAR_STORAGE_ACCOUNT}}" \
        -backend-config="container_name=${{env.TF_VAR_CONTAINER}}" \
        -backend-config="key=${{env.TF_VAR_STATE_KEY}}"

    # Generates an execution plan for Terraform
    # An exit code of 0 indicated no changes, 1 a terraform failure, 2 there are pending changes.
    - name: Terraform Plan
      id: tf-plan
      working-directory: terraform
      run: |
        export exitcode=0
        terraform plan -var 'project_name=${{ secrets.PROJECT_NAME }}' \
        -var 'owner_name=${{ secrets.OWNER_NAME }}' \
        -var 'resource_group_name=${{ secrets.TF_VAR_RESOURCE_GROUP }}' \
        -var 'log_analytics_workspace_name=${{ secrets.LOG_ANALYTICS_WS_NAME }}' \
        -var 'location=${{ secrets.LOCATION }}' \
        -var 'RabbitMQ-Password=${{ secrets.RABBITMQ_PASSWORD }}' \
        -var 'RabbitMQ-Username=${{ secrets.RABBITMQ_USERNAME }}' \
        -var 'sql-server-username=${{ secrets.SQL_USERNAME }}' \
        -var 'sql-server-password=${{ secrets.SQL_PASSWORD }}' \
        -detailed-exitcode -no-color -out tfplan || export exitcode=$?

        echo "exitcode=$exitcode" >> $GITHUB_OUTPUT
        
        if [ $exitcode -eq 1 ]; then
          echo Terraform Plan Failed!
          exit 1
        else 
          exit 0
        fi
    
    # Terraform Apply
    - name: Terraform Apply
      if: steps.tf-plan.outputs.exitcode == 2
      working-directory: terraform
      run: terraform apply -auto-approve tfplan

  deploy:
    runs-on: ubuntu-latest
    needs: [build, provision]
    environment:
      name: "Azure"
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    env:
      WEB_APP_NAME: "maalsi242mfouquetapi"

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.WEB_APP_NAME }}
          slot-name: "Production"
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: .
