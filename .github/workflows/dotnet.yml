# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x # Specify .NET 8.0 explicitly
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore

    - name: Publish build output
      run: dotnet publish --no-restore --configuration Release --output ./publish

    - name: Upload build artifact
      uses: actions/upload-artifact@v3
      with:
        name: build-artifact
        path: ./publish
        
  deploy:
    needs: build # Ensure deployment waits for the build job to complete successfully
    runs-on: ubuntu-latest

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v3
      with:
        name: build-artifact # Name of the artifact uploaded in the build job
        path: ./publish # Specify where to download the artifact

    - name: Deploy application
      run: |
        # Replace the following commands with your deployment logic
        echo "Deploying application..."
        ls ./publish
        echo "Deployment complete."
